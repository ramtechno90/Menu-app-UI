<footer class="p-4 bg-background-light dark:bg-background-dark">
<div class="flex flex-col gap-4">
<p class="text-center font-medium text-gray-600 dark:text-gray-400">Enter OTP from customer to confirm delivery</p>
<div class="flex items-center gap-4 justify-center">
<input class="w-full text-center text-2xl font-bold bg-gray-200 dark:bg-gray-700 rounded-lg py-3 focus:ring-primary focus:border-primary border-transparent tracking-[1em]" id="otp-input" maxlength="4" placeholder="----" type="text"/>
</div>
<button class="w-full bg-primary text-gray-900 font-bold py-3 px-4 rounded-lg" id="verify-otp-btn">Verify OTP</button>
</div>
</footer>
</div>
<div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden" id="success-popup">
<div class="bg-background-light dark:bg-background-dark rounded-xl p-6 text-center shadow-lg w-11/12 max-w-sm">
<div class="flex justify-center items-center w-16 h-16 rounded-full bg-green-100 dark:bg-green-900 mx-auto mb-4">
<span class="material-symbols-outlined text-4xl text-green-600 dark:text-green-400">check</span>
</div>
<h3 class="text-xl font-bold text-gray-900 dark:text-gray-50 mb-2">Right Customer</h3>
<p class="text-gray-600 dark:text-gray-400">Delivery confirmed successfully.</p>
</div>
</div>
<div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden" id="error-popup">
<div class="bg-background-light dark:bg-background-dark rounded-xl p-6 text-center shadow-lg w-11/12 max-w-sm">
<div class="flex justify-center items-center w-16 h-16 rounded-full bg-red-100 dark:bg-red-900 mx-auto mb-4">
<span class="material-symbols-outlined text-4xl text-red-600 dark:text-red-400">close</span>
</div>
<h3 class="text-xl font-bold text-gray-900 dark:text-gray-50 mb-2">Wrong OTP</h3>
<p class="text-gray-600 dark:text-gray-400">The entered OTP is incorrect. Please try again.</p>
</div>
</div>
<script>
    const otpInput = document.getElementById('otp-input');
    const verifyBtn = document.getElementById('verify-otp-btn');
    otpInput.addEventListener('input', (e) => {
        // Allow only numbers
        e.target.value = e.target.value.replace(/[^0-9]/g, '');
    });
    verifyBtn.addEventListener('click', () => {
        const otp = otpInput.value;
        if (otp.length === 4) {
            if (otp === '1234') { // Mock success OTP
                document.getElementById('success-popup').classList.remove('hidden');
                setTimeout(() => document.getElementById('success-popup').classList.add('hidden'), 2000);
            } else { // Mock error OTP
                document.getElementById('error-popup').classList.remove('hidden');
                setTimeout(() => {
                    document.getElementById('error-popup').classList.add('hidden');
                    otpInput.value = '';
                    otpInput.focus();
                }, 2000);
            }
        } else {
            // Handle incomplete OTP if needed
        }
    });
</script>
