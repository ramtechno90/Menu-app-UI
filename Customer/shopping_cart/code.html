<script>
  const manualAddressBtn = document.getElementById('manual-address-btn');
  const manualAddressForm = document.getElementById('manual-address-form');
  const currentLocationBtn = document.getElementById('current-location-btn');
  const mapImg = document.getElementById('map-img');
  const addressInput = document.getElementById('address');

  manualAddressBtn.addEventListener('click', () => {
    manualAddressForm.classList.toggle('hidden');
  });

  currentLocationBtn.addEventListener('click', () => {
    manualAddressForm.classList.add('hidden');
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition((position) => {
        const { latitude, longitude } = position.coords;
        // SECURITY WARNING: This is a placeholder access token.
        // Do not expose your real access token in client-side code.
        // It is recommended to use a server-side proxy to handle API requests
        // and keep your access token secure.
        const accessToken = 'pk.eyJ1IjoiZXhhbXBsZXMiLCJhIjoiY2p6Y3k5a3B2MDV3ZTNjbW55cW5wY2J2cyJ9.6lKx2VoGa3f3977l_3zCZA';
        const mapUrl = `https://api.mapbox.com/styles/v1/mapbox/streets-v11/static/${longitude},${latitude},12/600x400?access_token=${accessToken}`;
        mapImg.src = mapUrl;
      });
    } else {
      alert("Geolocation is not supported by this browser.");
    }
  });

  addressInput.addEventListener('change', (e) => {
    const address = e.target.value;
    // SECURITY WARNING: This is a placeholder access token.
    // Do not expose your real access token in client-side code.
    // It is recommended to use a server-side proxy to handle API requests
    // and keep your access token secure.
    const accessToken = 'pk.eyJ1IjoiZXhhbXBsZXMiLCJhIjoiY2p6Y3k5a3B2MDV3ZTNjbW55cW5wY2J2cyJ9.6lKx2VoGa3f3977l_3zCZA';
    const geocodingUrl = `https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(address)}.json?access_token=${accessToken}`;

    fetch(geocodingUrl)
      .then(response => response.json())
      .then(data => {
        if (data.features && data.features.length > 0) {
          const [longitude, latitude] = data.features[0].center;
          const mapUrl = `https://api.mapbox.com/styles/v1/mapbox/streets-v11/static/${longitude},${latitude},12/600x400?access_token=${accessToken}`;
          mapImg.src = mapUrl;
        } else {
          alert("Could not find the address. Please try a different one.");
        }
      })
      .catch(error => {
        console.error('Error:', error);
        alert("Could not find the address. Please try again.");
      });
  });
</script>
