<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Paradize Admin Portal</title>
    <link rel="stylesheet" href="css/style.css">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>

    <div class="container">
        <!-- Landing Page -->
        <div id="landing-container" class="view-container" style="display: block;"> <!-- Default visible -->
            <div class="auth-wrapper">
                <h2>Pizza Paradize Admin Portal</h2>
                <button class="landing-btn" onclick="App.showAdminLogin()">Admin Login</button>
            </div>
        </div>

        <!-- Admin Login -->
        <div id="admin-login-container" class="view-container">
            <div class="auth-wrapper">
                <h2>Admin Login</h2>
                <input type="email" id="admin-email" placeholder="Email">
                <input type="password" id="admin-password" placeholder="Password">
                <button onclick="App.login()">Login</button>
                <button onclick="App.showLanding()" style="background: none; color: #555; margin-top: 10px;">Back</button>
                <p id="admin-login-error" style="color: red;"></p>
            </div>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="admin-dashboard-container" class="view-container">
        <header>
            <div class="container">
                <h1>Admin Dashboard</h1>
                <nav>
                    <button onclick="AdminApp.showSection('orders')" class="active" id="nav-orders">Orders</button>
                    <button onclick="AdminApp.showSection('menu')" id="nav-menu">Menu Management</button>
                    <button onclick="App.logout()">Logout</button>
                </nav>
            </div>
        </header>

        <div class="container">
            <!-- Orders Section -->
            <div id="orders-section" class="section active">
                <h2>Orders</h2>

                <div class="controls">
                    <h3>Delete Delivered Orders</h3>
                    <input type="date" id="start-date">
                    <input type="date" id="end-date">
                    <button class="btn-small btn-danger" onclick="AdminApp.deleteDeliveredOrders('filter')">Delete by Date</button>
                    <button class="btn-small btn-danger" onclick="AdminApp.deleteDeliveredOrders('all')">Delete All Delivered</button>
                </div>

                <div id="orders-list"></div>
            </div>

            <!-- Menu Section -->
            <div id="menu-section" class="section">
                <h2>Menu Management</h2>

                <div class="controls">
                    <button onclick="AdminApp.downloadCsv()" class="btn-small">Download Menu CSV</button>
                    <input type="file" id="csv-upload" accept=".csv" style="display:none" onchange="AdminApp.uploadCsv(this)">
                    <button onclick="document.getElementById('csv-upload').click()" class="btn-small">Upload Menu CSV</button>
                </div>

                <div class="controls">
                    <h3>Categories</h3>
                    <button class="btn-small" onclick="openModal('category-modal')">Add Category</button>
                </div>
                <div id="categories-list"></div>

                <div class="controls" style="margin-top: 20px;">
                    <h3>Menu Items</h3>
                    <select id="category-filter" onchange="AdminApp.loadMenuItems()">
                        <option value="">Select Category</option>
                    </select>
                    <button class="btn-small" onclick="AdminApp.openItemModal()">Add Item</button>
                </div>
                <div id="menu-items-list"></div>
            </div>
        </div>
    </div>

    <!-- Modals (Admin Only) -->
    <div id="category-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('category-modal')">&times;</span>
            <h3 id="cat-modal-title">Add Category</h3>
            <input type="hidden" id="cat-id">
            <input type="text" id="cat-name" placeholder="Category Name">
            <input type="number" id="cat-order" placeholder="Order (Sort Index)">
            <button onclick="AdminApp.saveCategory()">Save</button>
        </div>
    </div>

    <div id="item-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('item-modal')">&times;</span>
            <h3 id="item-modal-title">Add Menu Item</h3>
            <input type="hidden" id="item-id">
            <select id="item-category"></select>
            <input type="text" id="item-name" placeholder="Item Name">
            <textarea id="item-desc" placeholder="Description" rows="3" style="width:100%; margin:10px 0; padding:10px; border:1px solid #ddd;"></textarea>
            <input type="number" id="item-price" placeholder="Price">
            <input type="text" id="item-image" placeholder="Image URL">
            <button onclick="AdminApp.saveMenuItem()">Save</button>
        </div>
    </div>

    <!-- Scripts -->
    <!-- Helper Global Functions for Modal -->
    <script>
        function openModal(id) { document.getElementById(id).style.display = 'block'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) event.target.style.display = 'none';
        }
    </script>
    <script src="js/firebase-config.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
