<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Paradize Delivery Portal</title>
    <link rel="stylesheet" href="css/style.css">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>

    <div class="container">
        <!-- Landing Page -->
        <div id="landing-container" class="view-container" style="display: block;"> <!-- Default visible -->
            <div class="auth-wrapper">
                <h2>Pizza Paradize Delivery Portal</h2>
                <button class="landing-btn btn-yellow" onclick="App.showDeliveryLogin()">Delivery Staff Login</button>
            </div>
        </div>

        <!-- Delivery Login -->
        <div id="delivery-login-container" class="view-container">
            <div class="auth-wrapper">
                <h2>Delivery Staff Login</h2>
                <input type="email" id="delivery-email" placeholder="Email">
                <input type="password" id="delivery-password" placeholder="Password">
                <button class="btn-yellow" onclick="App.login()">Login</button>
                <button onclick="App.showLanding()" style="background: none; color: #555; margin-top: 10px;">Back</button>
                <p id="delivery-login-error" style="color: red;"></p>
            </div>
        </div>
    </div>

    <!-- Delivery Dashboard -->
    <div id="delivery-dashboard-container" class="view-container">
        <header>
            <div class="container">
                <h1>My Deliveries</h1>
                <button id="nav-toggle" onclick="toggleNav()">☰</button>
                <nav id="delivery-nav">
                    <button onclick="DeliveryApp.showSection('active')" class="active" id="nav-active">Active</button>
                    <button onclick="DeliveryApp.showSection('history')" id="nav-history">History</button>
                    <button onclick="App.logout()">Logout</button>
                </nav>
            </div>
        </header>

        <div class="container">
            <!-- Active Section -->
            <div id="active-section" class="section active" style="display:block;">
                <div id="delivery-orders-list">
                    <p>Loading assigned orders...</p>
                </div>
            </div>

            <!-- History Section -->
            <div id="history-section" class="section" style="display:none;">
                <h2>History</h2>
                <div id="delivery-history-list"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/firebase-config.js"></script>
    <script src="js/delivery.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
